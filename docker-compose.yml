version: '3.8'
services:

  # ========== 基础设施 ==========
  # DaoCloud 镜像源: 官方 library 镜像加 docker.m.daocloud.io/library/ 前缀
  # 第三方镜像 (apache/, xuxueli/) DaoCloud 不支持, 保持原样
  # 如果第三方镜像也拉不到, 可全局替换为 docker.1ms.run/ 前缀

  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: clothing-postgres
    environment:
      POSTGRES_DB: wechat_clothing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./sql/phase1_3_tables.sql:/docker-entrypoint-initdb.d/02_phase_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: clothing-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 消息队列 ==========
  # 注意: apache/rocketmq 是第三方镜像, DaoCloud 不支持
  # 如果拉取失败, 请改为: docker.1ms.run/apache/rocketmq:5.1.4

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: clothing-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    volumes:
      - rocketmq_logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: clothing-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10911:10911"
      - "8081:8081"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rocketmq_broker_data:/home/rocketmq/store

  # ========== 定时任务 ==========
  # 注意: xuxueli/xxl-job-admin 是第三方镜像, DaoCloud 不支持
  # 如果拉取失败, 请改为: docker.1ms.run/xuxueli/xxl-job-admin:2.4.1

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: clothing-xxl-job-admin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:postgresql://postgres:5432/wechat_clothing
        --spring.datasource.username=postgres
        --spring.datasource.password=${DB_PASSWORD:-postgres123}
        --spring.datasource.driver-class-name=org.postgresql.Driver
        --xxl.job.accessToken=${XXL_JOB_TOKEN:-}
        --server.port=8080
    volumes:
      - xxljob_logs:/data/applogs

  # ========== 应用服务 ==========

  backend:
    build: .
    container_name: clothing-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wechat_clothing
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-for-jwt-token-signing}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      WX_PAY_APPID: ${WX_PAY_APPID:-}
      WX_MCH_ID: ${WX_MCH_ID:-}
      WX_MCH_KEY: ${WX_MCH_KEY:-}
      WX_NOTIFY_URL: ${WX_NOTIFY_URL:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_ACCESS_KEY: ${ALIYUN_OSS_ACCESS_KEY:-}
      ALIYUN_OSS_SECRET_KEY: ${ALIYUN_OSS_SECRET_KEY:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  rocketmq_logs:
  rocketmq_broker_data:
  xxljob_logs:
